<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Recommender</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
        padding: 20px;
      }
      .recipe-card {
        margin-bottom: 20px;
        transition: transform 0.2s;
      }
      .recipe-card:hover {
        transform: translateY(-5px);
      }
      .loading {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="text-center mb-4">Recipe Recommender</h1>

      {% if not dataset_exists %}
      <div class="alert alert-warning" role="alert">
        <strong>Warning:</strong> Dataset file
        (AITRAINX_DATASET_with_flavour.csv) not found! Please add the dataset
        file to continue.
      </div>
      {% endif %}

      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card">
            <div class="card-body">
              <form id="recipeForm">
                <div class="mb-3">
                  <label for="ingredients" class="form-label"
                    >Ingredients (comma-separated)</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="ingredients"
                    name="ingredients"
                    required
                    placeholder="e.g., tomato, onion, garlic"
                  />
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="cuisine" class="form-label"
                      >Cuisine (optional)</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="cuisine"
                      name="cuisine"
                      placeholder="e.g., Indian, Italian"
                    />
                  </div>

                  <div class="col-md-6 mb-3">
                    <label for="course" class="form-label"
                      >Course (optional)</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="course"
                      name="course"
                      placeholder="e.g., main course, dessert"
                    />
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="max_prep_time" class="form-label"
                      >Max Preparation Time (minutes)</label
                    >
                    <input
                      type="number"
                      class="form-control"
                      id="max_prep_time"
                      name="max_prep_time"
                      placeholder="e.g., 30"
                    />
                  </div>

                  <div class="col-md-6 mb-3">
                    <label for="food_type" class="form-label">Food Type</label>
                    <select class="form-select" id="food_type" name="food_type">
                      <option value="">Any</option>
                      <option value="veg">Vegetarian</option>
                      <option value="nonveg">Non-Vegetarian</option>
                    </select>
                  </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                  Get Recommendations
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <div class="text-center mt-4 loading">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <div id="results" class="row mt-4">
        <!-- Results will be displayed here -->
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document
        .getElementById("recipeForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const form = e.target;
          const resultsDiv = document.getElementById("results");
          const loading = document.querySelector(".loading");

          // Show loading spinner
          loading.style.display = "block";
          resultsDiv.innerHTML = "";

          try {
            const response = await fetch("/recommend", {
              method: "POST",
              body: new FormData(form),
            });

            const data = await response.json();

            if (data.success) {
              resultsDiv.innerHTML = data.recipes
                .map(
                  (recipe) => `
                        <div class="col-md-4">
                            <div class="card recipe-card">
                                <div class="card-body">
                                    <h5 class="card-title">${
                                      recipe.recipe_name
                                    }</h5>
                                    <p class="card-text">
                                        <strong>Cuisine:</strong> ${
                                          recipe.cuisine || "Not specified"
                                        }<br>
                                        <strong>Course:</strong> ${
                                          recipe.course || "Not specified"
                                        }<br>
                                        <strong>Prep Time:</strong> ${
                                          recipe["prep_time (in mins)"]
                                        } minutes<br>
                                        <strong>Food Type:</strong> ${
                                          recipe.food_type
                                        }
                                    </p>
                                    <div class="mt-3">
                                        <strong>Ingredients:</strong>
                                        <p class="small">${
                                          recipe.ingredients_name
                                        }</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `
                )
                .join("");
            } else {
              resultsDiv.innerHTML = `
                        <div class="col-12">
                            <div class="alert alert-warning" role="alert">
                                ${data.message}
                            </div>
                        </div>
                    `;
            }
          } catch (error) {
            resultsDiv.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-danger" role="alert">
                            An error occurred while fetching recommendations. Please try again.
                        </div>
                    </div>
                `;
          } finally {
            loading.style.display = "none";
          }
        });
    </script>
  </body>
</html>
